services:
  web:
    build: .
    container_name: Zh.Akerke.web
    ports:
      - "8080:80"

  db:
    build: ./db
    container_name: Zh.Akerke.db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass12345}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: Zh.Akerke.app
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-pass12345}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    container_name: Zh.Akerke.pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD:-pass12345}
    ports:
      - "5050:80"
    depends_on:
      - db

  redis:
    image: redis:7
    container_name: Zh.Akerke.redis
    ports:
      - "6379:6379"

volumes:
  db_data: